[package]
name = "square_sales_gui"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.27"
egui_plot = "0.27"
chrono = "0.4"
rust_decimal = "1.33"
rust_decimal_macros = "1.33"
csv = "1.3"
image = "0.24"
rfd = "0.14" # Native file dialogs (for CSV export / open)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
